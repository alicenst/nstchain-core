name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache: true
          cache-dependency-path: go.sum

      - name: Build linux/amd64 binary
        run: |
          make build-linux CMD=kava
          ./out/linux/nstchain version --long

      - name: Create checksum
        run: |
          cd out/linux
          cp nstchain "nstchain-${GITHUB_REF_NAME}-linux-amd64"
          sha256sum "nstchain-${GITHUB_REF_NAME}-linux-amd64" \
            > "nstchain-${GITHUB_REF_NAME}-linux-amd64.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "out/linux/nstchain-${GITHUB_REF_NAME}-linux-amd64#nstchain ${GITHUB_REF_NAME} linux/amd64" \
            "out/linux/nstchain-${GITHUB_REF_NAME}-linux-amd64.sha256#SHA-256 checksum" \
            --verify-tag \
            --generate-notes
