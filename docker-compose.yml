version: '3'

services:
  nstchainnode0:
    container_name: nstchainnode0
    image: "nstchain/nstchainnode"
    ports:
      - "26656-26657:26656-26657"
    environment:
      - ID=0
      - LOG=${LOG:-nstchain.log}
    volumes:
      - ./build:/nstchain:Z
    networks:
      localnet:
        ipv4_address: 192.168.10.2

  nstchainnode1:
    container_name: nstchainnode1
    image: "nstchain/nstchainnode"
    ports:
      - "26659-26660:26656-26657"
    environment:
      - ID=1
      - LOG=${LOG:-nstchain.log}
    volumes:
      - ./build:/nstchain:Z
    networks:
      localnet:
        ipv4_address: 192.168.10.3

  nstchainnode2:
    container_name: nstchainnode2
    image: "nstchain/nstchainnode"
    environment:
      - ID=2
      - LOG=${LOG:-nstchain.log}
    ports:
      - "26661-26662:26656-26657"
    volumes:
      - ./build:/nstchain:Z
    networks:
      localnet:
        ipv4_address: 192.168.10.4

  nstchainnode3:
    container_name: nstchainnode3
    image: "nstchain/nstchainnode"
    environment:
      - ID=3
      - LOG=${LOG:-nstchain.log}
    ports:
      - "26663-26664:26656-26657"
    volumes:
      - ./build:/nstchain:Z
    networks:
      localnet:
        ipv4_address: 192.168.10.5

networks:
  localnet:
    driver: bridge
    ipam:
      driver: default
      config:
      -
        subnet: 192.168.10.0/16
